<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essenza Luxur | Perfumes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <nav>
      <div class="logo">ESSENZA <span>LUXUR</span></div>
      <button class="cart-button" onclick="toggleCart()">🛒 <span id="cartCount">0</span></button>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">PERFUMERÍA SELECTA</p>
      <h1>Tu esencia.<br><span>Tu identidad.</span></h1>
      <p>Descubrí una selección de perfumes pensada para destacar tu estilo.</p>
      <a href="#catalogo" class="main-button">Ver catálogo</a>
    </div>
  </header>

  <main>
    <section id="catalogo" class="catalog-section">
      <div class="section-title">
        <p class="eyebrow">COLECCIÓN</p>
        <h2>Nuestros perfumes</h2>
        <p>Próximamente encontrarás todo nuestro catálogo.</p>
      </div>

      <div class="filters">
        <input id="search" type="search" placeholder="Buscar perfume..." oninput="renderProducts()">
        <select id="category" onchange="renderProducts()">
          <option value="all">Todas las categorías</option>
          <option value="Hombre">Hombre</option>
          <option value="Mujer">Mujer</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>

      <div id="products" class="products-grid"></div>
    </section>
  </main>

  <div id="cartOverlay" class="overlay hidden" onclick="closeCartOutside(event)">
    <aside class="cart-panel">
      <div class="cart-header">
        <h2>Tu pedido</h2>
        <button onclick="toggleCart()">✕</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-total">
        <span>Total</span>
        <strong id="cartTotal">$0</strong>
      </div>
      <form id="orderForm" onsubmit="sendOrder(event)">
        <input id="customerName" required placeholder="Tu nombre">
        <input id="customerAddress" placeholder="Dirección (opcional)">
        <select id="payment">
          <option value="A coordinar">Medio de pago: a coordinar</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
        </select>
        <button class="main-button full" type="submit">Enviar pedido por WhatsApp</button>
      </form>
    </aside>
  </div>

  <footer>
    <div class="logo">ESSENZA <span>LUXUR</span></div>
    <p>Perfumería selecta · Pedidos online</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
